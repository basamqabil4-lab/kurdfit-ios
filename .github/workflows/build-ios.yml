name: Build iOS App (.ipa)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Compile Kurd Fit iOS (.ipa) on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build static web bundle & copy to Capacitor iOS
        run: |
          rm -rf app/api
          npx next build
          npx cap copy ios

      - name: Build unsigned iOS Archive with Xcode
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build

      - name: Package .app into BQ-GYM-iOS.ipa
        run: |
          mkdir -p Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry BQ-GYM-iOS.ipa Payload
          cp BQ-GYM-iOS.ipa KurdFit-iOS.ipa

      - name: Upload BQ-GYM-iOS.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BQ-GYM-iOS-IPA
          path: |
            BQ-GYM-iOS.ipa
            KurdFit-iOS.ipa
